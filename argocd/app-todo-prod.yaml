apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todo-prod
  namespace: argocd
spec:
  project: todo
  source:
    repoURL: https://github.com/chishti21/todo-gitops.git
    targetRevision: main
    path: charts/todo-app
    helm:
      valueFiles:
        - ../../envs/values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true